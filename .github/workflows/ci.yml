name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck:examples

  test:
    name: Test (Postgres ${{ matrix.postgres }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [14, 15, 16, 17, 18]
        node: [24]
        include:
          - { postgres: 18, node: 22 }
          - { postgres: 18, node: 26 }
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test with coverage thresholds
        if: matrix.postgres == 18 && matrix.node == 24
        run: pnpm coverage
      - name: Test
        if: ${{ !(matrix.postgres == 18 && matrix.node == 24) }}
        run: pnpm test

  package:
    name: Package, examples & load test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm smoke
      - run: pnpm examples
      - run: pnpm bench
        env:
          LOAD_N: 5000
      - name: Check tarball contents
        run: npm pack --dry-run

  playground:
    name: Playground (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach --wait
      - name: Send an event and wait for delivery
        run: |
          curl -fsS -X POST localhost:3000/api/send -H 'content-type: application/json' \
            -d '{"eventType":"invoice.paid","payload":{"ci":true}}'
          for i in $(seq 1 60); do
            curl -fsS localhost:3000/api/state | grep -q '"succeeded":' && exit 0
            sleep 1
          done
          docker compose logs playground
          exit 1
      - if: always()
        run: docker compose down --volumes
