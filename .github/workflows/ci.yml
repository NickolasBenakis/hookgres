name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck:examples
      - name: Build site (fails on dead links)
        run: pnpm site:build

  test:
    name: Test (Postgres ${{ matrix.postgres }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [14, 15, 16, 17, 18]
        node: [24]
        include:
          - { postgres: 18, node: 22 }
          - { postgres: 18, node: 26 }
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test with coverage thresholds
        if: matrix.postgres == 18 && matrix.node == 24
        run: pnpm coverage
      - name: Test
        if: ${{ !(matrix.postgres == 18 && matrix.node == 24) }}
        run: pnpm test

  package:
    name: Package, examples & load test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm smoke
      - run: pnpm examples
      - run: pnpm bench
        env:
          LOAD_N: 5000
      - name: Check tarball contents
        run: npm pack --dry-run

  playground:
    name: Playground (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach --wait
      - name: Send an event and wait for delivery
        run: |
          curl -fsS -X POST localhost:3000/api/send -H 'content-type: application/json' \
            -d '{"eventType":"invoice.paid","payload":{"ci":true}}'
          for i in $(seq 1 60); do
            curl -fsS localhost:3000/api/state | grep -q '"succeeded":' && exit 0
            sleep 1
          done
          docker compose logs playground
          exit 1
      - if: always()
        run: docker compose down --volumes

  # On main, after every check passes: keep a "Version Packages" pull request
  # open while there are changesets, and publish to npm when it is merged.
  # Publishing uses npm trusted publishing (OIDC), so there is no npm token.
  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, test, package, playground]
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # tags and GitHub releases
      pull-requests: write # the Version Packages pull request
      id-token: write # npm trusted publishing
    # prepublishOnly runs the test suite again before publishing.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm 11.5.1+ is required for trusted publishing
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # v2 pushes tags and creates GitHub releases through the API; v1 failed
      # to read Changesets 3's output and silently skipped both.
      - uses: changesets/action@v2.1.2
        with:
          version-script: pnpm ci:version
          publish-script: pnpm ci:publish
          pr-title: Version Packages
          commit-message: Version Packages
