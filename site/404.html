  :root {

    --ink: oklch(22% 0.03 250);
    --muted: oklch(48% 0.02 250);

    --accent: oklch(42% 0.09 245);
    --accent-ink: oklch(99% 0 0);
    --code-bg: oklch(23% 0.03 250);
    --code-ink: oklch(92% 0.01 250);
    --code-dim: oklch(68% 0.02 250);
    --code-key: oklch(80% 0.09 220);
    --code-str: oklch(82% 0.1 145);
    --ok: oklch(52% 0.12 150);
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: oklch(17% 0.015 250);
      --surface: oklch(20.5% 0.018 250);
      --ink: oklch(94% 0.008 250);
      --muted: oklch(70% 0.015 250);
      --line: oklch(30% 0.02 250);
      --accent: oklch(75% 0.1 235);
      --accent-ink: oklch(18% 0.02 250);
      --code-bg: oklch(13.5% 0.015 250);
      --ok: oklch(75% 0.13 150);

  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.6 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  a, button { touch-action: manipulation; }
  button { user-select: none; -webkit-user-select: none; }
  a { color: var(--accent); text-underline-offset: 3px; }
  footer .wrap a { color: var(--muted); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
  @media (min-width: 600px) { .wrap { padding: 0 24px; } }

  header.top {
    display: flex; align-items: center; justify-content: space-between;
    padding-block: 20px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }

  nav.links { display: flex; gap: 4px; font-size: 15px; margin-right: -10px; }

  nav.links a:active { color: var(--ink); }

  .hero { display: grid; gap: 48px; grid-template-columns: minmax(0, 1fr); padding-block: 56px 72px; align-items: center; }
  @media (min-width: 900px) { .hero { grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); } }
  .eyebrow { font: 500 13px/1 var(--mono); color: var(--muted); letter-spacing: 0.02em; margin: 0 0 18px; }
  h1 {

  .btn {

    min-height: 44px; padding: 0 18px; border-radius: 10px; font-weight: 600; font-size: 15px;
    text-decoration: none; border: 1px solid transparent; cursor: pointer;
    transition: transform 120ms ease-out, background-color 150ms ease;

  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { border-color: var(--line); color: var(--ink); background: transparent; }
  .copy {
    font: 600 12px/1 var(--sans); min-height: 32px; min-width: 64px; padding: 0 10px;
    border-radius: 7px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer;
  }
  .copy:active { color: var(--ink); }
  .copy[data-copied] { color: var(--ok); border-color: currentColor; }

  .code {
    position: relative; background: var(--code-bg); color: var(--code-ink);
    border-radius: 14px; overflow: hidden; border: 1px solid oklch(100% 0 0 / 0.06);
  }
  .code .bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 10px 8px 16px; border-bottom: 1px solid oklch(100% 0 0 / 0.08);
    font: 12px/1 var(--mono); color: var(--code-dim);

  .code .copy { border-color: oklch(100% 0 0 / 0.15); color: var(--code-dim); }

  .c { color: var(--code-dim); }
  .k { color: var(--code-key); }
  .s { color: var(--code-str); }
  .p { color: var(--code-dim); user-select: none; -webkit-user-select: none; }

  section { padding-block: 64px; border-top: 1px solid var(--line); }
  h2 { font-size: clamp(26px, 3.4vw, 34px); letter-spacing: -0.02em; line-height: 1.15; margin: 0 0 12px; text-wrap: balance; }
  .sub { color: var(--muted); margin: 0 0 36px; max-width: 40em; font-size: 17px; }

  .split { display: grid; gap: 40px; grid-template-columns: minmax(0, 1fr); align-items: start; }
  @media (min-width: 900px) { .split { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); } }

  .features { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; grid-template-columns: 1fr; }
  @media (min-width: 700px) { .features { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 1000px) { .features { grid-template-columns: 1fr 1fr 1fr; } }
  .feature { background: var(--surface); padding: 24px; }
  .feature h3 { margin: 0 0 6px; font-size: 16px; letter-spacing: -0.01em; }
  .feature p { margin: 0; color: var(--muted); font-size: 15px; }
  :where(.feature, p, td) code { font: 0.9em var(--mono); background: color-mix(in oklch, var(--line) 55%, transparent); padding: 1px 5px; border-radius: 5px; }

  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; }
  td:first-child { font-weight: 550; }
  .table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
  .table-scroll table tr:last-child td { border-bottom: 0; }
  .yes { color: var(--ok); font-weight: 600; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
  .stat { border: 1px solid var(--line); border-radius: 14px; padding: 22px; background: var(--surface); }
  .stat .num { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .stat .label { color: var(--muted); font-size: 14px; }
  .note { color: var(--muted); font-size: 14px; margin-top: 16px; }
  .more { font-weight: 600; margin: 0; }

  .cta { text-align: center; padding-block: 80px; }
  .notfound { padding-block: 96px 120px; }
  .cta .actions { justify-content: center; }
  footer { border-top: 1px solid var(--line); padding-block: 28px; color: var(--muted); font-size: 14px; }
  footer .wrap { display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; }
  footer nav { display: flex; flex-wrap: wrap; gap: 4px 20px; }

  @media (hover: hover) and (pointer: fine) {
    a:hover { text-decoration-thickness: 2px; }
    nav.links a:hover { color: var(--ink); }
    .copy:hover { color: var(--ink); }
    .code .copy:hover { color: var(--code-ink); }
    footer .wrap a:hover { color: var(--ink); }
  }

  @media (max-width: 440px) { nav.links .wide { display: none; } }
  @media (max-width: 560px) {
    .install { width: 100%; justify-content: space-between; }
    .actions .btn { flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } .btn:active { transform: none; } }
