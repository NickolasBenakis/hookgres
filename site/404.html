<!-- Tokens, header, buttons and footer copied from index.html; keep the two in sync. -->
<style>
  :root {
    /* One brand hue: neutrals, code panels and shadows share it with the accent. */
    --h: 258;
    --bg: oklch(98.8% 0.003 var(--h));
    --bg-alt: oklch(96.5% 0.005 var(--h));
    --surface: oklch(100% 0 0);
    --ink: oklch(21% 0.012 var(--h));
    --ink-2: oklch(48% 0.014 var(--h));
    --ink-3: oklch(52% 0.012 var(--h));
    --line: oklch(90.5% 0.008 var(--h));
    /* Postgres blue */
    --accent: oklch(52% 0.19 var(--h));
    --accent-hover: oklch(47% 0.17 var(--h));
    --accent-ink: oklch(100% 0 0);
    --ok: oklch(52% 0.13 152);
    --warn: oklch(52% 0.13 60);
    --bad: oklch(50% 0.18 27);
    --code-bg: oklch(19.5% 0.02 var(--h));
    --code-line: oklch(29% 0.022 var(--h));
    --code-ink: oklch(93% 0.008 var(--h));
    --code-dim: oklch(66% 0.022 var(--h));
    --code-key: oklch(79% 0.11 var(--h));
    --code-str: oklch(82% 0.1 150);
    --shadow: 0 1px 2px oklch(25% 0.05 var(--h) / 0.04), 0 8px 24px oklch(25% 0.05 var(--h) / 0.06), 0 32px 64px oklch(25% 0.05 var(--h) / 0.06);
    /* Small raised surfaces: a ring standing in for the border, plus a tight shadow. */
    --raised: 0 0 0 1px oklch(25% 0.05 var(--h) / 0.07), 0 1px 2px oklch(25% 0.05 var(--h) / 0.05), 0 4px 12px -4px oklch(25% 0.05 var(--h) / 0.07);
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
    --wrap: 1200px;
    --gutter: max(24px, env(safe-area-inset-left));
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    --ease-out: cubic-bezier(0.32, 0.72, 0, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: oklch(0% 0 0);
      --bg-alt: oklch(15.5% 0.008 var(--h));
      --surface: oklch(19% 0.01 var(--h));
      --ink: oklch(96.5% 0.004 var(--h));
      --ink-2: oklch(72% 0.014 var(--h));
      --ink-3: oklch(66% 0.012 var(--h));
      --line: oklch(28% 0.012 var(--h));
      --accent: oklch(72% 0.14 var(--h));
      --accent-hover: oklch(78% 0.12 var(--h));
      --accent-ink: oklch(17% 0.04 var(--h));
      --ok: oklch(76% 0.15 152);
      --warn: oklch(80% 0.14 75);
      --bad: oklch(70% 0.17 27);
      --code-bg: oklch(17% 0.016 var(--h));
      --code-line: oklch(27% 0.018 var(--h));
      --shadow: 0 0 0 1px oklch(100% 0 0 / 0.08);
      --raised: 0 0 0 1px oklch(100% 0 0 / 0.1);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; scroll-padding-top: 72px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 var(--sans);
    letter-spacing: -0.006em;
    font-synthesis: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  a { color: var(--accent); text-decoration: none; }
  @media (hover: hover) and (pointer: fine) { a:hover { text-decoration: underline; text-decoration-thickness: from-font; text-underline-offset: 3px; } }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  ::selection { background: color-mix(in oklch, var(--accent) 22%, transparent); }
  code { font-family: var(--mono); font-size: 0.88em; letter-spacing: 0; }
  button { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  .wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 var(--gutter); }
  @media (max-width: 400px) { :root { --gutter: max(16px, env(safe-area-inset-left)); } }

  /* Header: content scrolls underneath, so the bar is translucent. */
  .nav {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in oklch, var(--bg) 78%, transparent);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid color-mix(in oklch, var(--line) 70%, transparent);
  }
  .nav .wrap { display: flex; align-items: center; gap: 32px; height: 56px; }
  .brand { display: inline-flex; align-items: center; gap: 9px; color: var(--ink); font-weight: 600; font-size: 16px; letter-spacing: -0.02em; flex: none; }
  .brand:hover { text-decoration: none; }
  .brand svg { width: 22px; height: 22px; border-radius: 6px; }
  .nav-links { display: flex; align-items: center; gap: 24px; font-size: 14px; }
  .nav-links a { color: var(--ink-2); transition: color 150ms var(--ease); }
  @media (hover: hover) and (pointer: fine) { .nav-links a:hover { color: var(--ink); text-decoration: none; } }
  .nav-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .search-trigger {
    display: inline-flex; align-items: center; gap: 8px;
    width: 220px; height: 32px; padding: 0 6px 0 11px; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--bg-alt); box-shadow: inset 0 0 0 1px var(--line);
    font: 13px/1 var(--sans); letter-spacing: 0; color: var(--ink-3); text-align: left;
    transition: box-shadow 150ms var(--ease), color 150ms var(--ease);
  }
  .search-trigger svg { width: 15px; height: 15px; flex: none; }
  .search-trigger .search-label { flex: 1; }
  .search-trigger kbd {
    font: 500 11px/1 var(--sans); letter-spacing: 0.02em; color: var(--ink-3);
    padding: 4px 6px; border-radius: 6px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line);
  }
  .search-trigger:active { transform: scale(0.98); }
  @media (hover: hover) and (pointer: fine) { .search-trigger:hover { color: var(--ink-2); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--ink) 22%, transparent); } }
  .pill {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border-radius: 999px; font-weight: 500; white-space: nowrap;
    transition: background-color 150ms var(--ease), transform 150ms var(--ease), box-shadow 150ms var(--ease);
  }
  .pill:hover { text-decoration: none; }
  .pill:active { transform: scale(0.97); }
  /* Header controls are 32–36px tall; their hit areas extend to 44px. */
  .search-trigger, .pill.small { position: relative; }
  .search-trigger::before, .pill.small::before { content: ""; position: absolute; inset: -6px -2px; }
  .nav-links a { padding-block: 12px; }
  .pill.small { height: 32px; padding: 0 14px; font-size: 13.5px; background: var(--accent); color: var(--accent-ink); }
  @media (hover: hover) and (pointer: fine) { .pill.small:hover { background: var(--accent-hover); } }
  @media (max-width: 860px) { .nav .wrap { gap: 24px; } .search-trigger { width: 180px; } }
  @media (max-width: 720px) { .nav-links .hide-md { display: none; } }
  @media (max-width: 640px) {
    .nav .wrap { gap: 18px; }
    .search-trigger { width: 36px; height: 36px; padding: 0; justify-content: center; }
    .search-trigger .search-label, .search-trigger kbd { display: none; }
    .search-trigger svg { width: 17px; height: 17px; }
  }
  @media (max-width: 520px) { .nav-links .hide-sm { display: none; } }
  @media (max-width: 360px) { .nav-links { display: none; } }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 24px; }
  .pill.large { height: 44px; padding: 0 22px; font-size: 15.5px; background: var(--accent); color: var(--accent-ink); }
  @media (hover: hover) and (pointer: fine) { .pill.large:hover { background: var(--accent-hover); } }
  .pill.ghost { height: 44px; padding: 0 20px; font-size: 15.5px; color: var(--ink); background: var(--surface); box-shadow: var(--raised); }
  @media (hover: hover) and (pointer: fine) { .pill.ghost:hover { background: color-mix(in oklch, var(--ink) 4%, var(--surface)); } }
  footer { border-top: 1px solid var(--line); padding: 28px 0 calc(40px + env(safe-area-inset-bottom)); font-size: 13px; color: var(--ink-3); }
  .footer-inner { display: flex; flex-wrap: wrap; gap: 14px 28px; justify-content: space-between; }
  .footer-links { display: flex; flex-wrap: wrap; gap: 8px 22px; }
  footer .footer-inner a { color: var(--ink-2); }

  .lost { padding-block: clamp(72px, 12vw, 136px); }
  .lost h1 { font-family: var(--display); font-size: clamp(38px, 1rem + 2.6vw, 54px); line-height: 1.06; letter-spacing: -0.034em; font-weight: 700; margin: 0; text-wrap: balance; }
  .lost p { font-size: clamp(17px, 0.95rem + 0.3vw, 19px); line-height: 1.45; color: var(--ink-2); margin: 16px 0 0; max-width: 34em; text-wrap: pretty; }
  .lost .eyebrow { margin: 0 0 16px; font-size: 14px; font-weight: 500; color: var(--ink-3); font-family: var(--mono); letter-spacing: 0; }
  .lost .search-hint { font-size: 15px; margin-top: 28px; }
  .lost .search-hint button::before { content: ""; position: absolute; inset: -12px -4px; }
  .lost .search-hint button { position: relative; font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }
  @media (hover: hover) and (pointer: fine) { .lost .search-hint button:hover { text-decoration: underline; text-underline-offset: 3px; } }
  @media (prefers-reduced-motion: reduce) { .pill, .search-trigger { transition: none; } }
</style>
</head>

      </button>
      <a class="pill small" href="/docs/getting-started">Get started</a>

  </div>
</header>

<main class="wrap lost">
  <p class="eyebrow">404</p>
  <h1>This page doesn't exist.</h1>
  <p>The link may be old, or the page may have moved into the docs.</p>
  <div class="actions">

<script>
  // The search shortcut hint matches the platform.
  {
    const platform = navigator.userAgentData?.platform ?? navigator.platform ?? "";
    if (!/mac|iphone|ipad/i.test(platform)) {
      for (const kbd of document.querySelectorAll(".search-trigger kbd")) kbd.textContent = "Ctrl K";
    }
  }
</script>
<script src="/search.js" defer></script>
